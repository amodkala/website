<article class="post">
    <header class="post-header">
        <h1 class="post-title">$title$</h1>
        <div class="post-meta">
            <time datetime="$date$">$date$</time>
        </div>
    </header>

    <div class="post-layout">
        <nav id="left-toc" class="toc" aria-label="Table of contents">
            <!-- Generated by js/toc.js -->
        </nav>

        <div class="post-content">
            $body$
        </div>
    </div>
</article>
